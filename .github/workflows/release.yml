name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@f8651e2b5a940a49eb703a9d48ed496a07dccbe8
    with:
      benchmark-ref: f8651e2b5a940a49eb703a9d48ed496a07dccbe8
      setup-command: |
        uv venv --python 3.13 && uv pip install -e ".[test]"
      test-command: |
        .venv/bin/python -m pytest -q -m "not live_npu"
