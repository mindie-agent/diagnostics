name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@79ff5c3105774266dc72e780b4ecdf1f7d7c7200
    with:
      test-command: .venv/bin/python -m pytest -q -m "not live_npu"
      setup-command: uv venv --python 3.13 && uv pip install -e ".[test]"
