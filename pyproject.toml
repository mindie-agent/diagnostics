[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-diagnostics"
version = "0.5.0"
description = "Bounded diagnostics, support bundles, and Ascend profiler analysis for MindIE owners"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mindie-diagnostics = "mindie_diagnostics.cli:main"
mindie-profiler = "mindie_profiler.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["mindie_diagnostics", "mindie_profiler"]

[tool.hatch.build.targets.sdist]
include = ["/mindie_diagnostics", "/mindie_profiler", "/tests", "/benchmarks", "/docs", "/README.md", "/README.en.md", "/AGENTS.md", "/LICENSE", "/pyproject.toml"]
