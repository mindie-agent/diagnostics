[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-diagnostics"
version = "0.3.0"
description = "Bounded structured diagnostics and safe support bundles for MindIE owners"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mindie-diagnostics = "mindie_diagnostics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mindie_diagnostics"]
