[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-diagnostics"
version = "0.5.3"
description = "Bounded structured diagnostics, local error codes, support bundles, and opt-in telemetry reporting for MindIE Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mindie-diagnostics = "mindie_diagnostics.cli:main"

[tool.setuptools.packages.find]
include = ["mindie_diagnostics*"]

[tool.pytest.ini_options]
markers = [
    "live_npu: standing A2/A3 Ascend NPU non-destructive live integration",
]
