[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-diagnostics"
version = "0.5.0"
description = "Bounded diagnostics, support bundles, and Ascend profiler analysis for MindIE owners"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mindie-diagnostics = "mindie_diagnostics.cli:main"
mindie-profiler = "mindie_profiler.__main__:main"
mindie-sim = "mindie_sim.__main__:main"

[tool.setuptools.packages.find]
include = ["mindie_diagnostics*", "mindie_profiler*", "mindie_sim*"]

[tool.pytest.ini_options]
markers = [
    "live_npu: standing A2/A3 Ascend NPU non-destructive live integration",
]

[tool.setuptools.package-data]
mindie_profiler = ["knowledge/*.json"]
